#
#  ios-ci.yml
#  Quill
#
#  Pipeline de CI para Pull Requests hacia develop.
#  Corre la suite del paquete, comprueba que el .xcodeproj no derivó del
#  project.yml, compila para simulador y pasa SwiftLint en modo estricto.
#

name: iOS CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Evita builds redundantes cancelando el run anterior del mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job que analiza los archivos tocados para no gastar CI en cambios de docs
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs-only: ${{ steps.docs-check.outputs.docs-only }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Path filtering
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'App/**'
              - 'Packages/**'
              - 'project.yml'
              - 'Quill.xcodeproj/**'
              - '.swiftlint.yml'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'Docs/**'

      - name: Check for documentation-only changes
        id: docs-check
        run: |
          if [[ "${{ steps.filter.outputs.code }}" == "false" && "${{ steps.filter.outputs.docs }}" == "true" ]]; then
            echo "docs-only=true" >> $GITHUB_OUTPUT
          else
            echo "docs-only=false" >> $GITHUB_OUTPUT
          fi

  # Job central: tests del paquete y compilación de la app
  build-and-test:
    needs: changes
    runs-on: macos-15
    timeout-minutes: 30
    if: needs.changes.outputs.docs-only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      # Primero y más rápido: la suite es Swift puro más un store SwiftData en
      # memoria, así que no necesita arrancar simulador.
      - name: Execute tests
        run: swift test --package-path Packages/QuillCore --xunit-output TestResults.xml

      - name: Install XcodeGen
        run: brew install xcodegen

      # Protege el trade-off del ADR-004: el proyecto generado se commitea, así
      # que el CI lo regenera y falla si derivó del project.yml.
      - name: The committed project matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Quill.xcodeproj || {
            echo "::error::Quill.xcodeproj está desactualizado. Corre 'make project' y commitea el resultado."
            exit 1
          }

      - name: Build
        run: |
          xcodebuild build \
            -project Quill.xcodeproj \
            -scheme Quill \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults-*.xml
          retention-days: 7

  lint:
    needs: changes
    runs-on: macos-15
    timeout-minutes: 10
    if: needs.changes.outputs.docs-only != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict
