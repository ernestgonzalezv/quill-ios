name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and fastest: the whole suite is pure Swift plus an in-memory
  # SwiftData store, so it needs no simulator boot.
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test --package-path Packages/QuillCore

  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      # Guards the trade-off in ADR-004: the generated project is committed, so CI
      # regenerates it and fails if it has drifted from project.yml.
      - name: Check the committed project matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Quill.xcodeproj || {
            echo "::error::Quill.xcodeproj is out of date. Run 'make project' and commit the result."
            exit 1
          }
      - name: Build
        run: |
          xcodebuild build \
            -project Quill.xcodeproj \
            -scheme Quill \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -quiet

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict
