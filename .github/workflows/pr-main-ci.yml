#
#  pr-main-ci.yml
#  Quill
#
#  Pipeline de CI para Pull Requests hacia main.
#  Compila el proyecto, ejecuta tests y verifica que la configuración de
#  Release apunte a producción — a main solo llega lo que se puede publicar.
#

name: PR to Main CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # El equivalente al check de `typeHostServer` de Cococel: una Release que
      # sale apuntando a staging es un bug que solo se descubre en producción.
      - name: Verify the Release configuration points at production
        run: |
          RELEASE_URL=$(awk '/^        Release:/{flag=1; next} flag && /QUILL_API_BASE_URL/{print $2; exit}' project.yml)
          if [[ "$RELEASE_URL" == *"staging"* || -z "$RELEASE_URL" ]]; then
            echo "::error::La configuración Release apunta a '$RELEASE_URL', se esperaba el host de producción"
            exit 1
          fi
          echo "OK     Release QUILL_API_BASE_URL = $RELEASE_URL"

      - name: Execute tests
        run: swift test --package-path Packages/QuillCore --xunit-output TestResults.xml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          xcodegen generate
          xcodebuild build \
            -project Quill.xcodeproj \
            -scheme Quill \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults.xml
          retention-days: 7
