# XcodeGen manifest — the source of truth for the Xcode project.
#
# The generated `Quill.xcodeproj` is committed so the repo opens with a
# double-click, but this file is what gets edited. Reason: `project.pbxproj` is a
# generated, ID-keyed format that conflicts on almost every concurrent branch and
# is unreviewable in a pull request. Regenerate with `make project`.
name: Quill

options:
  bundleIdPrefix: com.ernestgonzalezv
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  QuillCore:
    path: Packages/QuillCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Full data-race checking, not the "minimal" default. Concurrency bugs are
    # the expensive ones to find later.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Warnings that catch real bugs, promoted from off-by-default.
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE

targets:
  Quill:
    type: application
    platform: iOS
    sources:
      - path: App/Quill
    dependencies:
      - package: QuillCore
        product: QuillDomain
      - package: QuillCore
        product: QuillData
      - package: QuillCore
        product: QuillFeature
    info:
      path: App/Quill/Info.plist
      properties:
        CFBundleDisplayName: Quill
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Read at launch by `AppConfiguration`. Kept in the plist rather than
        # hardcoded in Swift so staging and production differ by build setting,
        # not by an `#if DEBUG` branch that can ship inverted.
        QuillAPIBaseURL: $(QUILL_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ernestgonzalezv.quill
        PRODUCT_NAME: Quill
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          QUILL_API_BASE_URL: https://staging.api.quill.example.com/v1
        Release:
          QUILL_API_BASE_URL: https://api.quill.example.com/v1

schemes:
  Quill:
    build:
      targets:
        Quill: all
    run:
      config: Debug
    test:
      config: Debug
      # The package's own test targets run via `swift test` in CI; the scheme
      # exists so tests are also runnable with ⌘U from Xcode.
      targets:
        - package: QuillCore/QuillDomainTests
        - package: QuillCore/QuillDataTests
        - package: QuillCore/QuillFeatureTests
    archive:
      config: Release
